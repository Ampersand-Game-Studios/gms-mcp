name: CI

on:
  workflow_dispatch:
    inputs:
      run_real_gamemaker_smoke:
        description: Run the licensed GameMaker smoke matrix without publishing
        required: false
        default: false
        type: boolean
  pull_request:
    branches:
      - "dev"
      - "pre-release"
      - "main"
  push:
    branches:
      - "dev"
      - "pre-release"
      - "main"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }}, Py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        exclude:
          - os: ubuntu-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.28"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --frozen --all-extras --python ${{ matrix.python-version }}

      - name: Build package
        run: uv run --frozen python -m build

      - name: Verify package privacy boundary
        run: uv run --frozen python scripts/verify_package_artifacts.py dist

      - name: Run MCP tool smoke
        env:
          GMS_MCP_POST_MUTATION_VERIFY: "off"
          GMS_MCP_TOOLSETS: "all"
        run: uv run --frozen python scripts/run_mcp_tool_smoke.py --init-minimal-base --base-project build/mcp-smoke/base-project --work-root build/mcp-smoke/work --output build/reports/mcp_tool_smoke_report.json --tools gm_safe_delete gm_create_object gm_event_add gm_maintenance_validate_json gm_room_instance_add gm_room_layer_add gm_verification_status gm_list_assets gm_project_info gm_search_references gm_workflow_duplicate gm_sprite_frame_count

      - name: Run tests
        run: uv run --frozen python -m pytest -q

      - name: Verify generated compatibility matrix
        run: uv run --frozen python scripts/generate_compatibility_matrix.py --check

  quality:
    name: Quality/Coverage (ubuntu-latest, Py3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python 3.12
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.28"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --frozen --all-extras --python 3.12

      - name: Build package
        run: uv run --frozen python -m build

      - name: Verify package privacy boundary
        run: uv run --frozen python scripts/verify_package_artifacts.py dist

      - name: Run MCP tool smoke
        env:
          GMS_MCP_POST_MUTATION_VERIFY: "off"
          GMS_MCP_TOOLSETS: "all"
        run: uv run --frozen python scripts/run_mcp_tool_smoke.py --init-minimal-base --base-project build/mcp-smoke/base-project --work-root build/mcp-smoke/work --output build/reports/mcp_tool_smoke_report.json --tools gm_safe_delete gm_create_object gm_event_add gm_maintenance_validate_json gm_room_instance_add gm_room_layer_add gm_verification_status gm_list_assets gm_project_info gm_search_references gm_workflow_duplicate gm_sprite_frame_count

      - name: Generate quality reports
        run: uv run --frozen python scripts/generate_quality_reports.py

      - name: Generate sanitized compatibility evidence
        run: >-
          uv run --frozen python scripts/generate_compatibility_matrix.py
          --evidence-output build/reports/compatibility_evidence.json
          --executed-evidence "quality pytest suite"
          --verified-as-of "${{ github.sha }}"

      - name: Upload compatibility evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: compatibility-evidence-ubuntu-latest-py3.12
          path: build/reports/compatibility_evidence.json
          if-no-files-found: error

      - name: Upload quality reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: quality-reports-ubuntu-latest-py3.12
          path: |
            build/reports/TEST_COVERAGE_REPORT.md
            build/reports/MCP_TOOL_VALIDATION_REPORT.md
            build/reports/quality_summary.json
            build/reports/mcp_tool_smoke_report.json
            build/reports/coverage.xml
            build/reports/pytest_results.xml
          if-no-files-found: error

  lint_and_types:
    name: Lint/Types (Py3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.28"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --frozen --all-extras --python 3.12

      - name: Ruff
        run: |
          uv run --frozen ruff check .
          uv run --frozen ruff format --check .

      - name: Verify generated compatibility matrix
        run: uv run --frozen python scripts/generate_compatibility_matrix.py --check

      - name: Pyright
        run: uv run --frozen pyright

  dependency_audit:
    name: Dependency audit (Py3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.28"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install audit tooling from the committed lock
        run: uv sync --frozen --extra dev --python 3.12

      - name: Audit every locked dependency
        run: >-
          uv export --frozen --all-extras --format requirements-txt --no-emit-project |
          uv run --frozen pip-audit --requirement /dev/stdin --no-deps --disable-pip
          --strict --progress-spinner off

  mcp_conformance:
    name: MCP 2026-07-28 Conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.28"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: "24"

      - name: Install server dependencies
        run: uv sync --frozen --all-extras --python 3.12

      - name: Start loopback Streamable HTTP server
        env:
          GM_PROJECT_ROOT: ${{ github.workspace }}/cli/tests/fixtures/mcp-conformance
          GMS_MCP_POST_MUTATION_VERIFY: "off"
          GMS_MCP_TOOLSETS: core
        run: |
          mkdir -p build/reports/mcp-conformance
          uv run --frozen gms-mcp server \
            --transport streamable-http --host 127.0.0.1 --port 8765 --path /mcp \
            >build/reports/mcp-conformance/server.log 2>&1 &
          server_pid=$!
          echo "GMS_MCP_SERVER_PID=$server_pid" >> "$GITHUB_ENV"
          for attempt in {1..30}; do
            probe_code=$(curl --silent --output /dev/null --write-out '%{http_code}' \
              --max-time 2 --request POST \
              --header 'Content-Type: application/json' \
              --header 'Accept: application/json, text/event-stream' \
              --data '{}' http://127.0.0.1:8765/mcp || true)
            if [ "$probe_code" = "400" ]; then
              exit 0
            fi
            if ! kill -0 "$server_pid"; then
              cat build/reports/mcp-conformance/server.log
              exit 1
            fi
            sleep 0.5
          done
          cat build/reports/mcp-conformance/server.log
          exit 1

      - name: Run official protocol scenarios
        run: |
          scenarios=(
            server-stateless
            tools-list
            tools-call-simple-text
            tools-call-error
            server-sse-multiple-streams
            resources-list
            sep-2164-resource-not-found
            prompts-list
            dns-rebinding-protection
            caching
            http-header-validation
            http-custom-header-server-validation
            input-required-result-unsupported-methods
          )
          for scenario in "${scenarios[@]}"; do
            npx -y @modelcontextprotocol/conformance@0.2.0-alpha.11 server \
              --url http://127.0.0.1:8765/mcp \
              --scenario "$scenario" \
              --spec-version 2026-07-28 \
              --expected-failures cli/tests/mcp-conformance-expected-failures.yml \
              --output-dir build/reports/mcp-conformance
          done

      - name: Stop conformance server
        if: always()
        run: |
          if kill -0 "$GMS_MCP_SERVER_PID" 2>/dev/null; then
            kill "$GMS_MCP_SERVER_PID"
          fi

      - name: Start Resolve conformance fixture
        run: |
          uv run --frozen python3 cli/tests/fixtures/mcp-resolve-conformance/server.py \
            >build/reports/mcp-conformance/resolve-server.log 2>&1 &
          resolve_server_pid=$!
          echo "GMS_MCP_RESOLVE_SERVER_PID=$resolve_server_pid" >> "$GITHUB_ENV"
          for attempt in {1..30}; do
            probe_code=$(curl --silent --output /dev/null --write-out '%{http_code}' \
              --max-time 2 --request POST \
              --header 'Content-Type: application/json' \
              --header 'Accept: application/json, text/event-stream' \
              --data '{}' http://127.0.0.1:8766/mcp || true)
            if [ "$probe_code" = "400" ]; then
              exit 0
            fi
            if ! kill -0 "$resolve_server_pid"; then
              cat build/reports/mcp-conformance/resolve-server.log
              exit 1
            fi
            sleep 0.5
          done
          cat build/reports/mcp-conformance/resolve-server.log
          exit 1

      - name: Run official Resolve and input-required scenarios
        run: |
          scenarios=(
            input-required-result-basic-elicitation
            input-required-result-basic-sampling
            input-required-result-basic-list-roots
            input-required-result-request-state
            input-required-result-multiple-input-requests
            input-required-result-multi-round
            input-required-result-missing-input-response
            input-required-result-non-tool-request
            input-required-result-result-type
            input-required-result-unsupported-methods
            input-required-result-tampered-state
            input-required-result-capability-check
            input-required-result-ignore-extra-params
            input-required-result-validate-input
          )
          for scenario in "${scenarios[@]}"; do
            npx -y @modelcontextprotocol/conformance@0.2.0-alpha.11 server \
              --url http://127.0.0.1:8766/mcp \
              --scenario "$scenario" \
              --spec-version 2026-07-28 \
              --output-dir build/reports/mcp-conformance
          done

      - name: Stop Resolve conformance fixture
        if: always()
        run: |
          if kill -0 "$GMS_MCP_RESOLVE_SERVER_PID" 2>/dev/null; then
            kill "$GMS_MCP_RESOLVE_SERVER_PID"
          fi

      - name: Upload conformance reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mcp-2026-07-28-conformance
          path: build/reports/mcp-conformance
          if-no-files-found: error

  mac_runner_session:
    name: macOS Runner/Session (Py${{ matrix.python-version }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.28"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --frozen --all-extras --python ${{ matrix.python-version }}

      - name: Run runner/session tests
        run: |
          uv run --frozen python -m pytest -q \
            cli/tests/python/test_run_session.py \
            cli/tests/python/test_runner_session_integration.py \
            cli/tests/python/test_runtime_manager.py

      - name: Run install parity tests
        run: |
          uv run --frozen python -m pytest -q \
            cli/tests/python/test_install_polish.py \
            cli/tests/python/test_install_parity.py

  real_gamemaker_smoke:
    name: Real GameMaker Smoke (${{ matrix.host_platform }}, ${{ matrix.fixture_name }})
    # The gamemaker-ci environment admits only dev, pre-release, and main.
    # Licensed jobs run on disposable GitHub-hosted VMs, never studio machines.
    if: >-
      (github.event_name == 'push' && vars.GMS_MCP_REAL_SMOKE_ENABLED == 'true') ||
      (github.event_name == 'workflow_dispatch' && inputs.run_real_gamemaker_smoke)
    environment: gamemaker-ci
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - host_platform: linux
            runner: ubuntu-24.04
            fixture_name: gm-2024
            expected_runtime: 2024.14.4.268
          - host_platform: linux
            runner: ubuntu-24.04
            fixture_name: gm-2026-lts
            expected_runtime: 2026.0.0.23
          - host_platform: windows
            runner: windows-2025
            fixture_name: gm-2024
            expected_runtime: 2024.14.4.268
          - host_platform: windows
            runner: windows-2025
            fixture_name: gm-2026-lts
            expected_runtime: 2026.0.0.23
          - host_platform: macos
            runner: macos-15
            fixture_name: gm-2024
            expected_runtime: 2024.14.4.268
          - host_platform: macos
            runner: macos-15
            fixture_name: gm-2026-lts
            expected_runtime: 2026.0.0.23
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.28"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --frozen --all-extras --python 3.12

      - name: Install official Ubuntu GameMaker prerequisites
        if: matrix.host_platform == 'linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y
          build-essential clang curl ffmpeg libcurl4-openssl-dev libfuse2
          libgl1-mesa-dev libglu1-mesa-dev libopenal-dev libssl-dev
          libxrandr-dev libxxf86vm-dev openssh-server pulseaudio zlib1g-dev

      - name: Install ephemeral GameMaker runtime and licence
        env:
          GAMEMAKER_ACCESS_KEY: ${{ secrets.GAMEMAKER_ACCESS_KEY }}
        run: uv run --frozen python scripts/setup_gamemaker_ci.py "${{ matrix.expected_runtime }}"

      - name: Run real GameMaker fixture smoke
        run: >-
          uv run --frozen python scripts/run_real_gamemaker_smoke.py
          --fixture-name "${{ matrix.fixture_name }}"
          --expected-runtime-version "${{ matrix.expected_runtime }}"
          --required
          --privacy-safe-output
          --output "build/reports/real_gamemaker_smoke-${{ matrix.host_platform }}-${{ matrix.fixture_name }}.json"

      - name: Delete ephemeral GameMaker licence
        if: always()
        run: uv run --frozen python scripts/setup_gamemaker_ci.py --cleanup

      - name: Upload real GameMaker smoke report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: real-gamemaker-smoke-${{ matrix.host_platform }}-${{ matrix.fixture_name }}
          path: build/reports/real_gamemaker_smoke-${{ matrix.host_platform }}-${{ matrix.fixture_name }}.json
          if-no-files-found: warn

  # Summary job - this is the ONE check you require in branch protection
  ci:
    name: ci
    runs-on: ubuntu-latest
    needs: [test, quality, lint_and_types, dependency_audit, mcp_conformance, mac_runner_session, real_gamemaker_smoke]
    if: always()
    steps:
      - name: Check test results
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_REAL_GAMEMAKER_SMOKE_REQUESTED: ${{ inputs.run_real_gamemaker_smoke }}
          REAL_GAMEMAKER_SMOKE_ENABLED: ${{ vars.GMS_MCP_REAL_SMOKE_ENABLED }}
          REAL_GAMEMAKER_SMOKE_RESULT: ${{ needs.real_gamemaker_smoke.result }}
        run: |
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "Tests failed or were cancelled"
            exit 1
          fi
          if [ "${{ needs.quality.result }}" != "success" ]; then
            echo "Quality/coverage failed or was cancelled"
            exit 1
          fi
          if [ "${{ needs.lint_and_types.result }}" != "success" ]; then
            echo "Lint/types failed or were cancelled"
            exit 1
          fi
          if [ "${{ needs.dependency_audit.result }}" != "success" ]; then
            echo "Dependency audit failed or was cancelled"
            exit 1
          fi
          if [ "${{ needs.mcp_conformance.result }}" != "success" ]; then
            echo "MCP conformance failed or was cancelled"
            exit 1
          fi
          if [ "${{ needs.mac_runner_session.result }}" != "success" ]; then
            echo "macOS runner/session tests failed or were cancelled"
            exit 1
          fi
          if { [ "$EVENT_NAME" = "push" ] && [ "$REAL_GAMEMAKER_SMOKE_ENABLED" = "true" ]; } ||
             { [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$MANUAL_REAL_GAMEMAKER_SMOKE_REQUESTED" = "true" ]; }; then
            if [ "$REAL_GAMEMAKER_SMOKE_RESULT" != "success" ]; then
              echo "Requested real GameMaker smoke matrix failed, was skipped, or was cancelled"
              exit 1
            fi
          elif [ "$REAL_GAMEMAKER_SMOKE_RESULT" != "skipped" ]; then
            echo "Real GameMaker smoke executed without an authorized push or manual request"
            exit 1
          fi
          echo "All tests passed!"
