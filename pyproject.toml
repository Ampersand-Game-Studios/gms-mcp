[build-system]
requires = ["setuptools>=77,<82", "setuptools-scm>=8,<9", "wheel>=0.45,<1"]
build-backend = "setuptools.build_meta"

[project]
name = "gms-mcp"
dynamic = ["version"]
description = "GameMaker CLI + MCP server toolset"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  {name = "Ampersand Game Studios"},
]
keywords = ["gamemaker", "mcp", "cursor", "cli", "tools"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "mcp==2.0.0",
  "mcp-types==2.0.0",
  "pydantic>=2,<3",
  "colorama>=0.4.6,<1",
  "tomli>=2,<3; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
  "build>=1,<2",
  "packaging>=25,<27",
  "pytest>=9,<10",
  "pytest-cov>=7,<8",
  "Pillow>=10,<13",
  "opentelemetry-sdk>=1.28,<2",
  "pip-audit>=2.9,<3",
  "ruff>=0.9,<1",
  "pyright>=1.1.390,<2",
  # Needed for type-checking on Python 3.11+ where the runtime uses tomllib.
  "tomli>=2,<3",
]
import = [
  "Pillow>=10,<13",
]

[project.urls]
Homepage = "https://github.com/Ampersand-Game-Studios/gms-mcp"
Repository = "https://github.com/Ampersand-Game-Studios/gms-mcp"
Issues = "https://github.com/Ampersand-Game-Studios/gms-mcp/issues"

[project.scripts]
gms = "gms_helpers.cli:main"
gms-mcp = "gms_mcp.cli:main"
gms-mcp-init = "gms_mcp.cli:init"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]
fallback_version = "0.1.0"
version_scheme = "guess-next-dev"
local_scheme = "no-local-version"

[tool.pytest.ini_options]
testpaths = ["cli/tests/python"]
python_files = ["test_*.py"]
pythonpath = ["src", "."]

[tool.coverage.run]
source = ["src"]
parallel = true
patch = ["subprocess"]

[tool.ruff]
target-version = "py310"
line-length = 120
exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
# Keep this lightweight: focus on undefined names/exports to catch real breakages early
# without forcing a style cleanup across the repo.
select = ["F821", "F822", "F823"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
